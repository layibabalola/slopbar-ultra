[package]
name = "slopbar"
version = "0.1.0"
edition = "2021"
default-run = "slopbar"
license = "GPL-3.0-only"
repository = "https://github.com/thelioo/slopbar"

[lib]
name = "slopbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-updater", "dep:tauri-plugin-notification", "dep:tauri-plugin-global-shortcut", "dep:webview2-com", "dep:tauri-winrt-notification"]
# Local fixes must not silently replace themselves with an upstream release.
upstream-updates = ["desktop"]
# SlopBar Ultra release builds: updates only from the fork's own signed channel (docs/ULTRA-RELEASES.md).
ultra-updates = ["upstream-updates"]

[[bin]]
name = "slopbar"
path = "src/main.rs"
required-features = ["desktop"]

# Agents' stdio MCP server. Separate so app updates never stop an agent's server mid-session.
[[bin]]
name = "slopbar-mcp"
path = "src/bin/slopbar-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# SlopBar's own requests (net.rs): Windows' own certificate checks (rustls-platform-verifier) and the
# system's proxy, as the updater's reqwest does; one reqwest in the build.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
# The proxy environment variables' rules as reqwest applies them (NO_PROXY), for proxy.rs; both are
# already in the build through reqwest.
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy"] }
http = "1"
# reqwest's TLS cryptography (ring, as the updater installs it), and its errors, to say why a
# request failed.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
futures = "0.3"
base64 = "0.22"
sys-locale = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
# configure_client hands SlopBar the plugin's reqwest builder (net::windows_proxy): its docs ask to pin
# the minor version when using it.
tauri-plugin-updater = { version = "~2.12", optional = true }
# rt-multi-thread: proxy.rs waits for Windows' proxy answer with block_in_place on the app's runtime.
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "macros", "net", "io-util"] }
tauri-plugin-notification = { version = "2", optional = true }
# The quick switcher's system-wide hotkey.
# 2.4 needs a newer tauri than the one locked here.
tauri-plugin-global-shortcut = { version = "~2.3", optional = true }
# Read-only view of the Codex CLI's own thread list and rollouts.
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = { version = "0.13", default-features = false }
# Fast substring search over long transcript lines (already in the tree through serde_json).
memchr = "2"
# Backups: an AEAD and a password KDF from RustCrypto, never anything home-grown.
chacha20poly1305 = "0.10"
argon2 = "0.5"
# Already in the tree through reqwest; named here to check phone-alert URLs.
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Environment", "Win32_Networking_WinHttp", "Win32_Networking_WinInet", "Win32_NetworkManagement_IpHelper"] }
# UI Automation, to find taskbar items that have no window of their own (the Widgets button), and
# Task Scheduler for SlopBar Ultra's watchdog task (keep_running).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_TaskScheduler", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common"] }
# The native taskbar widget's Direct2D points and transforms.
windows-numerics = "0.2"
# PNGs of the native widget for agents (inspect_window); already in the tree.
png = "0.17"
# The webview Tauri already uses, to read and capture a window for agents without showing it.
webview2-com = { version = "0.38", optional = true }
# The toast the notification plugin shows, used directly where a click must open Settings.
tauri-winrt-notification = { version = "0.8", optional = true }

[dev-dependencies]
# Throwaway certificates for HTTPS tests, made afresh in every run (test_tls.rs).
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

# Argon2 is unusably slow unoptimised; backup tests use the real parameters.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
