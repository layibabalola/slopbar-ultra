name: Ultra release

# SlopBar Ultra (fork-only); see docs/ULTRA-RELEASES.md. Every push to ultra that changes what ships
# ($shippingPaths in scripts/publish-ultra-release.ps1) is published here as the next
# <package>-ultra.<n>: built, signed with the fork's updater key and released, and the update channel
# (the ultra-latest release) moves to it. Installs pick it up within 15 minutes. A tag ultra-v<version>
# pushed on its own (`publish-ultra-release.ps1 -ViaActions`) is published the same way. The jobs run
# the steps of scripts/publish-ultra-release.ps1, which a machine with the key can also run by hand.
#
# One run at a time, never cancelled, so each run takes its build number after the previous one has
# finished. A newer waiting run replaces an older waiting one, and it carries that one's commits: a
# push is compared with the channel's release, not with the push before it. A push that changes only
# the release tooling rehearses Check and Build without publishing.
#
# One publisher per tag: a tag made together with its release (by the script on the key's machine,
# or by this workflow, whose token starts no runs) arrives with that release, and this workflow
# leaves it alone. Only a tag pushed on its own is published here.

on:
  push:
    branches: [ultra]
    tags: ['ultra-v*']

concurrency:
  group: ultra-release
  cancel-in-progress: false

permissions: {}

jobs:
  # mode: push (publish this push to ultra), tag (publish this tag), rehearsal, or none.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          HAS_KEY: ${{ secrets.ULTRA_UPDATER_KEY != '' }}
          HAS_PASSWORD: ${{ secrets.ULTRA_UPDATER_KEY_PASSWORD != '' }}
          # The release workflow of older commits reads these names and publishes without the
          # installer hook or checks, so they must never be set.
          HAS_RETIRED: ${{ secrets.ULTRA_TAURI_SIGNING_PRIVATE_KEY != '' || secrets.ULTRA_TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          $mode = 'none'
          $keys = @(@($env:HAS_KEY, $env:HAS_PASSWORD) -eq 'true').Count
          if ($env:HAS_RETIRED -eq 'true') {
            '::error::Delete the secrets ULTRA_TAURI_SIGNING_PRIVATE_KEY and ULTRA_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: the release workflow of older commits would publish with them, without the installer checks. The key belongs in ULTRA_UPDATER_KEY (docs/ULTRA-RELEASES.md).'
            exit 1
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($keys -eq 0) {
              '::notice::No ULTRA_ signing secrets, so this workflow publishes nothing.'
            } elseif ($keys -eq 1) {
              '::error::Only one of the two ULTRA_ signing secrets is set; set both (docs/ULTRA-RELEASES.md).'
              exit 1
            } else {
              $author = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" --jq .author.login 2> gh.err
              if ($LASTEXITCODE -eq 0) {
                "::notice::$env:GITHUB_REF_NAME already has its release (published by $author), so this workflow publishes nothing."
              } elseif ((Get-Content gh.err -Raw) -match 'HTTP 404') {
                $mode = 'tag'
              } else {
                Get-Content gh.err
                exit 1
              }
            }
          } else {
            ./scripts/publish-ultra-release.ps1 -Step Decide -Before "$env:BEFORE" -Stage "$env:RUNNER_TEMP/decide" -Repo $env:GITHUB_REPOSITORY
            $mode = Get-Content "$env:RUNNER_TEMP/decide/mode" -Raw
            if ($mode -eq 'push' -and $keys -ne 2) {
              '::error::This push changes what ships, but the two ULTRA_ signing secrets are not both set (docs/ULTRA-RELEASES.md).'
              exit 1
            }
            if ($mode -eq 'none') { '::notice::Nothing that ships changed since the release the channel holds.' }
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT
          exit 0

  # No secrets and a read-only token: the build runs third-party build scripts.
  build:
    needs: gate
    if: needs.gate.outputs.mode != 'none'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      MODE: ${{ needs.gate.outputs.mode }}
      TAG: ${{ needs.gate.outputs.mode == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      # A push: the pushed commit, under the next build number. A tag: its version, on its commit.
      - name: Check the source and version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = if ($env:TAG) { @{ Tag = $env:TAG } } else { @{ Auto = $true } }
          ./scripts/publish-ultra-release.ps1 -Step Check @source -Stage "$env:RUNNER_TEMP/ultra-release" -Repo $env:GITHUB_REPOSITORY

      # Unit tests, the installer with the hook, and the provenance and installer checks.
      - name: Build and check the installer
        shell: pwsh
        env:
          # The runner's default TEMP has an 8.3 short name in it (C:\Users\RUNNER~1\...). Two pins
          # launcher tests fail under such a spelling, so the unit tests get the runner's long-named
          # temp folder, as on the owner's machines.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: ./scripts/publish-ultra-release.ps1 -Step Build -Tag "$env:TAG" -Stage "$env:RUNNER_TEMP/ultra-release" -Repo $env:GITHUB_REPOSITORY

      # Offline, on synthetic repositories; signs with a throwaway key.
      - name: Test the publisher
        shell: pwsh
        run: ./scripts/test-publish-ultra-release.ps1

      - name: Keep the installer for the publish job
        if: env.MODE != 'rehearsal'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ultra-release
          path: |
            ${{ runner.temp }}/ultra-release/release.json
            ${{ runner.temp }}/ultra-release/build.json
            ${{ runner.temp }}/ultra-release/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  # A fresh runner that the build never touched. Only Sign gets the secrets, and only Publish gets a
  # token that can write.
  publish:
    needs: [gate, build]
    if: needs.gate.outputs.mode == 'push' || needs.gate.outputs.mode == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.gate.outputs.mode == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # No cache: the signer (the tauri CLI) comes from the registry, checked against the lockfile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ultra-release
          path: ${{ runner.temp }}/ultra-release

      - name: Sign
        shell: pwsh
        env:
          ULTRA_UPDATER_KEY: ${{ secrets.ULTRA_UPDATER_KEY }}
          ULTRA_UPDATER_KEY_PASSWORD: ${{ secrets.ULTRA_UPDATER_KEY_PASSWORD }}
        run: ./scripts/publish-ultra-release.ps1 -Step Sign -Tag "$env:TAG" -Stage "$env:RUNNER_TEMP/ultra-release" -Repo $env:GITHUB_REPOSITORY

      - name: Publish and move the update channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-ultra-release.ps1 -Step Publish -Tag "$env:TAG" -Stage "$env:RUNNER_TEMP/ultra-release" -Repo $env:GITHUB_REPOSITORY
