name: Ultra release

# SlopBar Ultra (fork-only); see docs/ULTRA-RELEASES.md. A tag ultra-v<package version>-ultra.<build>
# pushed on its own (`pwsh scripts/publish-ultra-release.ps1 -ViaActions` pushes one) is built,
# signed with the fork's updater key and published here, and the update channel (the ultra-latest
# release) moves to it. The jobs run the steps of scripts/publish-ultra-release.ps1, the same steps
# the machine with the key runs, so both publishers make and check a release alike.
#
# One publisher per tag: that script creates its tag together with the tag's release, so a tag that
# arrives with a release is published already, and this workflow stands down. It also stands down
# while the ULTRA_ signing secrets are unset.
#
# A push to ultra that changes the release tooling rehearses Check and Build; it publishes nothing.

on:
  push:
    tags: ['ultra-v*']
    branches: [ultra]
    paths:
      - .github/workflows/ultra-release.yml
      - scripts/publish-ultra-release.ps1
      - scripts/test-publish-ultra-release.ps1
      - src-tauri/nsis/**

# Each tag runs on its own; a newer rehearsal replaces an older one. Publishing itself takes turns
# (the publish job's group).
concurrency:
  group: ultra-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.ULTRA_TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_PASSWORD: ${{ secrets.ULTRA_TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          publish=false
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::notice::Rehearsal: the release tooling changed, so Check and Build run. Nothing is published."
          elif [ "$HAS_KEY" != true ] && [ "$HAS_PASSWORD" != true ]; then
            echo "::notice::No ULTRA_ signing secrets, so this workflow publishes nothing. Releases come from the machine with the key."
          elif [ "$HAS_KEY" != true ] || [ "$HAS_PASSWORD" != true ]; then
            echo "::error::Only one of the two ULTRA_ signing secrets is set; set both (docs/ULTRA-RELEASES.md)."
            exit 1
          elif author=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .author.login 2>gh.err); then
            echo "::notice::$GITHUB_REF_NAME already has its release (published by $author), so this workflow publishes nothing."
          elif grep -q 'HTTP 404' gh.err; then
            publish=true
          else
            cat gh.err >&2
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # No secrets and a read-only token: the build runs third-party build scripts.
  build:
    needs: gate
    if: needs.gate.outputs.publish == 'true' || github.ref_type == 'branch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      # A tag: its version, on its commit. A rehearsal: the next build number, on the ultra tip.
      - name: Check the source and version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/publish-ultra-release.ps1 -Step Check -Tag "$env:TAG" -Stage "$env:RUNNER_TEMP/ultra-release" -Repo $env:GITHUB_REPOSITORY

      # Unit tests, the installer with the hook, and the provenance and installer checks.
      - name: Build and check the installer
        shell: pwsh
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/publish-ultra-release.ps1 -Step Build -Tag "$env:TAG" -Stage "$env:RUNNER_TEMP/ultra-release" -Repo $env:GITHUB_REPOSITORY

      # Offline, on synthetic repositories; signs with a throwaway key.
      - name: Test the publisher
        shell: pwsh
        run: ./scripts/test-publish-ultra-release.ps1

      - name: Keep the installer for the publish job
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ultra-release
          path: |
            ${{ runner.temp }}/ultra-release/release.json
            ${{ runner.temp }}/ultra-release/build.json
            ${{ runner.temp }}/ultra-release/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  # A fresh runner that the build never touched. Only Sign gets the secrets, and only Publish gets a
  # token that can write.
  publish:
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: ultra-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # No cache: the signer (the tauri CLI) comes from the registry, checked against the lockfile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ultra-release
          path: ${{ runner.temp }}/ultra-release

      - name: Sign
        shell: pwsh
        env:
          ULTRA_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ULTRA_TAURI_SIGNING_PRIVATE_KEY }}
          ULTRA_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ULTRA_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/publish-ultra-release.ps1 -Step Sign -Tag $env:GITHUB_REF_NAME -Stage "$env:RUNNER_TEMP/ultra-release" -Repo $env:GITHUB_REPOSITORY

      - name: Publish and move the update channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-ultra-release.ps1 -Step Publish -Tag $env:GITHUB_REF_NAME -Stage "$env:RUNNER_TEMP/ultra-release" -Repo $env:GITHUB_REPOSITORY
