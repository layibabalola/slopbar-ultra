name: Add account without the CLI on PATH

# A clean Windows runner has no Claude Code, the way a computer with only the Claude desktop app has
# none on PATH. This builds SlopBar and drives it through its door (scripts/test-cli-discovery.ps1):
# with no Claude Code anywhere, Add account says how to install it; with only the copy the Claude
# desktop app keeps for itself, it starts the sign-in from that copy; and it finds a CLI added to
# the user PATH after SlopBar started. Claude Code is the official build, downloaded and checked as
# Anthropic's installer does it (and for Anthropic's signature), but never installed.

on:
  push:
    paths:
      - src-tauri/src/cli.rs
      - src-tauri/src/cli/**
      - src-tauri/src/login.rs
      - src-tauri/src/accounts.rs
      - src-tauri/src/sources.rs
      - src-tauri/src/signin.rs
      - src-tauri/src/app.rs
      - src-tauri/src/mcp.rs
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src/i18n.js
      - scripts/test-cli-discovery.ps1
      - .github/workflows/cli-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build the app and its door
        run: cargo build --locked --features tauri/custom-protocol --bin slopbar --bin slopbar-mcp --manifest-path src-tauri/Cargo.toml
      - name: Download Claude Code where SlopBar does not look
        shell: pwsh
        run: |
          "image $env:ImageOS $env:ImageVersion"
          # As https://claude.ai/install.ps1 downloads it: the latest version, checked against its manifest.
          $base = 'https://downloads.claude.ai/claude-code-releases'
          $version = "$(Invoke-RestMethod "$base/latest")".Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "unexpected version: $version" }
          $checksum = (Invoke-RestMethod "$base/$version/manifest.json").platforms.'win32-x64'.checksum
          $held = Join-Path $env:RUNNER_TEMP 'held'
          New-Item -ItemType Directory -Force $held | Out-Null
          $exe = Join-Path $held 'claude.exe'
          Invoke-WebRequest "$base/$version/win32-x64/claude.exe" -OutFile $exe
          if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $checksum) { throw 'checksum mismatch' }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O="?Anthropic, PBC') { throw "not signed by Anthropic: $($signature.Status) $($signature.SignerCertificate.Subject)" }
          "Claude Code $version, signed by Anthropic: $(& $exe --version)"
      - name: Add account, step by step
        shell: pwsh
        run: ./scripts/test-cli-discovery.ps1 -App src-tauri/target/debug/slopbar.exe -Door src-tauri/target/debug/slopbar-mcp.exe -ClaudeExe "$env:RUNNER_TEMP/held/claude.exe" -Commit $env:GITHUB_SHA
